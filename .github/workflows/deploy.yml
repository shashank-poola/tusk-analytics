name: Deploy

# Runs from ci.yml after every CI job passes on a push to main, or by hand
# from the Actions tab (main only). Order: D1 migrations → API Worker → web.
#
# Backward compatibility: the old Worker keeps serving traffic between the
# migration and the deploy, and again after a `wrangler rollback`. Before
# applying anything, "Check pending migrations" reads which migrations
# production has applied and rejects any pending one that drops, renames or
# rebuilds (scripts/check-migrations.ts --remote-pending). CI ran the same
# check on the PR. Runbook: docs/runbooks/deploy.md.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: "false"
  D1_DATABASE: viewtally

jobs:
  api:
    name: Migrate D1 and deploy API
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Required reviewers and the CLOUDFLARE_* secrets live on this
    # environment, so nothing runs with credentials before approval.
    environment:
      name: production
      url: ${{ vars.API_BASE_URL }}
    # One production deploy at a time; a newer run waits, never cancels.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    # Secrets are passed per step, never job-wide, so `bun install` and the
    # other steps never see them.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Read applied migrations
        id: applied
        working-directory: packages/db
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          bunx wrangler d1 execute "$D1_DATABASE" --remote --json \
            --command "SELECT name FROM d1_migrations ORDER BY id" \
            > "$RUNNER_TEMP/applied.json" 2> "$RUNNER_TEMP/applied.err"
          echo "exit code $?"
          exit 0

      - name: Check pending migrations
        run: |
          D1_APPLIED_OUTPUT="$(cat "$RUNNER_TEMP/applied.json")" \
          D1_APPLIED_STDERR="$(cat "$RUNNER_TEMP/applied.err")" \
            bun scripts/check-migrations.ts --remote-pending

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: bun
          workingDirectory: packages/db
          command: d1 migrations apply ${{ env.D1_DATABASE }} --remote

      - name: Deploy API Worker
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: bun
          workingDirectory: apps/api
          command: deploy

      # There is no health endpoint. An unknown /api/v1 route must answer
      # 404 in the API's error format; that only happens after
      # assertValidEnv() passed, so it also proves every secret is set.
      - name: Smoke test
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || steps.deploy.outputs.deployment-url }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::error::Set the API_BASE_URL variable on the production environment."
            exit 1
          fi
          url="${API_BASE_URL%/}/api/v1/__smoke_test"
          for attempt in 1 2 3 4 5; do
            status=$(curl -sS -o "$RUNNER_TEMP/smoke.json" -w '%{http_code}' "$url" || echo 000)
            if [ "$status" = "404" ] && grep -q '"code":"not_found"' "$RUNNER_TEMP/smoke.json"; then
              echo "Smoke test passed: $url → 404 not_found"
              exit 0
            fi
            echo "Attempt $attempt: HTTP $status"
            sleep 5
          done
          echo "::error::Smoke test failed. Roll back with docs/runbooks/deploy.md."
          cat "$RUNNER_TEMP/smoke.json" || true
          exit 1

  web:
    name: Deploy web
    needs: api
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # apps/web has no hosting config yet (no OpenNext/wrangler, no Vercel
      # project). Replace this step once the host is chosen; see
      # docs/runbooks/deploy.md.
      - run: echo "::warning::apps/web hosting isn't set up; the web app was not deployed."
